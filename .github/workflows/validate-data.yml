name: Validate car cost data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check data quality
        run: python3 scripts/validate_data.py
